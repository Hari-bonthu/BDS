name: BDS Technical SEO CI & Regression Suite

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seo-audit:
    name: Playwright & Technical SEO Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build Application & Pre-Render Static HTML Routes
        run: npm run build

      - name: Run Automated BDS SEO Parity & Crawl Audit
        run: npm run test:seo

      - name: Publish SEO Report to GitHub Actions Summary
        if: always()
        run: |
          if [ -f seo-report.md ]; then
            cat seo-report.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload SEO Audit Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bds-seo-audit-reports
          path: |
            seo-report.json
            seo-report.md
