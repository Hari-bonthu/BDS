    <script>
      // Single Page Application clean-path redirect for GitHub Pages (No Hashtags)
      (function () {
        var l = window.location;
        var pathSegments = l.pathname.split('/').filter(Boolean);
        var isRepo = pathSegments[0] === 'BDS';
        var repoPrefix = isRepo ? '/BDS' : '';
        var remainingSegments = isRepo ? pathSegments.slice(1) : pathSegments;
        var remainingPath = '/' + remainingSegments.join('/');
        if (!remainingSegments.length) remainingPath = '/';

        var knownRoutes = [
          'services',
          'portfolio',
          'insights',
          'about',
          'contact',
          'privacy',
          'terms',
          'pricing'
        ];
        var firstSeg = remainingSegments[0] || '';
        if (knownRoutes.indexOf(firstSeg) !== -1 || remainingPath === '/') {
          var search = l.search ? '&' + l.search.slice(1) : '';
          var targetUrl = repoPrefix + '/?p=' + encodeURIComponent(remainingPath) + search;
          l.replace(targetUrl);
        }
      })();
    </script>
