    <!-- Clean SPA Path Restorer for GitHub Pages (removes query param, restores clean pathname without hashtags) -->
    <script>
      (function() {
        var params = new URLSearchParams(window.location.search);
        var redirect = params.get('p');
        if (redirect) {
          params.delete('p');
          var searchStr = params.toString();
          var remainingSearch = searchStr ? '?' + searchStr : '';
          var pathSegments = window.location.pathname.split('/').filter(Boolean);
          var repoPrefix = pathSegments[0] === 'BDS' ? '/BDS' : '';
          var cleanPath = redirect.startsWith('/') ? redirect : '/' + redirect;
          var newUrl = repoPrefix + cleanPath + remainingSearch + window.location.hash;
          window.history.replaceState(null, '', newUrl);
        }
      })();
